name: Release

# Ogni push su main pubblica la Release v<CFBundleShortVersionString> di Info.plist.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Usa l'Xcode più recente
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "Xcode: $xcode, SDK: $sdk"
          echo "MIN_SDK_MAJOR=${sdk%%.*}" >> "$GITHUB_ENV"

      - name: Leggi la versione
        id: version
        run: echo "value=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Resources/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Compila l'app
        run: bash macos/scripts/build.sh

      - name: Crea ZIP e DMG e verifica
        run: |
          bash macos/scripts/build.sh --skip-build --zip --dmg
          make verify-release

      - name: Pubblica la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            macos/ClaudeUsageBar.zip
            macos/ClaudeUsageBar.dmg
          tag_name: v${{ steps.version.outputs.value }}
          name: Consumi Claude ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
