name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Usa l'Xcode più recente
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "Xcode: $xcode, SDK: $sdk"
          echo "MIN_SDK_MAJOR=${sdk%%.*}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cd macos && swift build -c release

      - name: Run tests
        run: cd macos && swift test

      - name: Build app archives
        run: make release-artifacts

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ClaudeUsageBar.zip
          path: macos/ClaudeUsageBar.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ClaudeUsageBar.dmg
          path: macos/ClaudeUsageBar.dmg
